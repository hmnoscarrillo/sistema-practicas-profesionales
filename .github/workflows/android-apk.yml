name: Compilar APK Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias y compilar frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://sistema-practicas-profesionales.vercel.app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: practicas-profesionales-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
